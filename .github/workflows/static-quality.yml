name: Static quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: node --check script.js
      - name: Validate required runtime references
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("index.html", "utf8");
          const script = fs.readFileSync("script.js", "utf8");
          const required = ["@supabase/supabase-js@2.57.0", "script.js?v=", "update_customer_complete_v1"];
          for (const value of required) {
            if (!(html + script).includes(value)) throw new Error("Missing required runtime reference: " + value);
          }
          NODE
